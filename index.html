<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>WG ToDos</title>

<style>

:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #151515;
  --muted: #777;
  --border: #dedede;
  --dark: #171717;
  --chip-light: #f1f1f1;
  --success: #28a745;
  --danger: #e5484d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 1050px;
  margin: 0 auto;
  padding: 32px 18px 60px;
}


/* -----------------------------
   HEADER
----------------------------- */

header {
  margin-bottom: 28px;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 6vw, 54px);
  letter-spacing: -0.04em;
}

.subtitle {
  margin-top: 7px;
  color: var(--muted);
}


/* -----------------------------
   STATUS
----------------------------- */

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;

  margin-top: 15px;
  padding: 7px 11px;

  background: white;
  border-radius: 999px;

  font-size: 13px;
  color: var(--muted);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #bbb;
}

.status.online .status-dot {
  background: #34c759;
}

.status.error .status-dot {
  background: var(--danger);
}


/* -----------------------------
   SCHEDULE TABLE
----------------------------- */

.schedule-wrapper {
  overflow-x: auto;
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 5px 25px rgba(0,0,0,.06);
}

.schedule {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}

.schedule th,
.schedule td {
  border-bottom: 1px solid #ededed;
  padding: 12px;
}

.schedule thead th {
  background: #fafafa;
  font-size: 13px;
  text-align: center;
}

.schedule thead th:first-child {
  text-align: left;
  width: 150px;
}

.date-cell {
  font-weight: 600;
  white-space: nowrap;
}

.date-week {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 3px;
}

.person-header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
}

.person-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}


/* -----------------------------
   CHIPS
----------------------------- */

.chip-cell {
  text-align: center;
}

.chip {
  position: relative;

  display: inline-flex;

  width: 52px;
  height: 52px;

  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 14px;

  background: var(--chip-light);
  color: var(--dark);

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}

.chip:hover {
  transform: translateY(-2px);
}

.chip:active {
  transform: scale(.94);
}

.chip.done {
  background: var(--dark);
  color: white;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
}

.chip svg {
  width: 25px;
  height: 25px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.checkmark {
  position: absolute;
  right: -4px;
  top: -4px;

  width: 18px;
  height: 18px;

  display: none;
  align-items: center;
  justify-content: center;

  background: white;
  color: var(--dark);

  border-radius: 50%;
  font-size: 11px;
  font-weight: 800;

  box-shadow: 0 2px 7px rgba(0,0,0,.18);
}

.chip.done .checkmark {
  display: flex;
}


/* -----------------------------
   TODO LIST
----------------------------- */

.todos-section {
  margin-top: 32px;
}

.todos-card {
  background: white;
  border-radius: 18px;
  padding: 22px;

  box-shadow: 0 5px 25px rgba(0,0,0,.06);
}

.todos-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;

  margin-bottom: 17px;
}

.todos-title h2 {
  margin: 0;
  font-size: 22px;
}

.todo-count {
  color: var(--muted);
  font-size: 13px;
}

.todo-form {
  display: flex;
  gap: 9px;
  margin-bottom: 18px;
}

.todo-input {
  min-width: 0;
  flex: 1;

  border: 1px solid var(--border);
  border-radius: 12px;

  padding: 12px 14px;

  font: inherit;
  outline: none;
}

.todo-input:focus {
  border-color: #888;
}

.add-button {
  border: 0;
  border-radius: 12px;

  padding: 0 18px;

  background: var(--dark);
  color: white;

  font-weight: 600;
  cursor: pointer;
}

.add-button:hover {
  opacity: .88;
}

.todo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px 13px;

  background: #f7f7f7;
  border-radius: 12px;

  animation: todoIn .2s ease;
}

@keyframes todoIn {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.todo-checkbox {
  appearance: none;

  width: 22px;
  height: 22px;

  flex: 0 0 22px;

  border: 1.5px solid #aaa;
  border-radius: 7px;

  cursor: pointer;

  background: white;
}

.todo-checkbox:checked {
  background: var(--dark);
  border-color: var(--dark);
}

.todo-checkbox:checked::after {
  content: "✓";

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100%;

  color: white;
  font-size: 13px;
  font-weight: bold;
}

.todo-text {
  flex: 1;
  word-break: break-word;
}

.empty {
  padding: 25px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}


/* -----------------------------
   RESPONSIVE
----------------------------- */

@media (max-width: 600px) {

  .app {
    padding: 22px 12px 40px;
  }

  .schedule th,
  .schedule td {
    padding: 9px 6px;
  }

  .chip {
    width: 46px;
    height: 46px;
  }

  .chip svg {
    width: 22px;
    height: 22px;
  }

  .todos-card {
    padding: 16px;
  }

  .todo-form {
    flex-direction: column;
  }

  .add-button {
    height: 45px;
  }
}


/* -----------------------------
   CONFETTI
----------------------------- */

.confetti {
  position: fixed;
  width: 9px;
  height: 13px;

  pointer-events: none;

  z-index: 9999;

  animation:
    confetti-fall 900ms ease-out forwards;
}

@keyframes confetti-fall {

  0% {
    opacity: 1;
    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

  100% {
    opacity: 0;
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      rotate(
        var(--rotation)
      );
  }
}

</style>
</head>


<body>

<div class="app">

  <header>

    <h1>WG ToDos</h1>

    <div class="subtitle">
      Wer macht was?
    </div>

    <div
      id="status"
      class="status"
    >
      <span class="status-dot"></span>
      <span id="statusText">
        Lade Daten …
      </span>
    </div>

  </header>


  <!-- ==========================
       ROTATIONS-TABELLE
  =========================== -->

  <div class="schedule-wrapper">

    <table class="schedule">

      <thead>

        <tr>

          <th>Datum</th>

          <th>
            <div class="person-header">
              <span
                class="person-dot"
                style="background:#ff6b6b"
              ></span>
              <span id="person0"></span>
            </div>
          </th>

          <th>
            <div class="person-header">
              <span
                class="person-dot"
                style="background:#4dabf7"
              ></span>
              <span id="person1"></span>
            </div>
          </th>

          <th>
            <div class="person-header">
              <span
                class="person-dot"
                style="background:#69db7c"
              ></span>
              <span id="person2"></span>
            </div>
          </th>

        </tr>

      </thead>

      <tbody id="scheduleBody"></tbody>

    </table>

  </div>


  <!-- ==========================
       TODO LISTE
  =========================== -->

  <section class="todos-section">

    <div class="todos-card">

      <div class="todos-title">

        <h2>Weitere ToDos</h2>

        <span
          class="todo-count"
          id="todoCount"
        >
          0
        </span>

      </div>


      <form
        class="todo-form"
        id="todoForm"
      >

        <input
          id="todoInput"
          class="todo-input"
          type="text"
          placeholder="Neues Todo …"
          autocomplete="off"
        />

        <button
          class="add-button"
          type="submit"
        >
          Hinzufügen
        </button>

      </form>


      <div
        id="todoList"
        class="todo-list"
      ></div>

    </div>

  </section>

</div>


<script>

/* ==================================================
   KONFIGURATION
================================================== */

/*
 * HIER DIE APPS-SCRIPT-URL EINTRAGEN.
 *
 * Beispiel:
 *
 * https://script.google.com/macros/s/ABC123.../exec
 */
const API_URL =
  "DEINE_APPS_SCRIPT_URL_HIER_EINTRAGEN";


/*
 * Namen der drei Mitbewohner.
 *
 * Einfach ändern:
 *
 * "Anna"
 * "Ben"
 * "Chris"
 */
const PEOPLE = [
  "Michel",
  "Joscha",
  "Joshi"
];


/*
 * Startdatum:
 *
 * Dienstag, 13.10.2026
 */
const START_DATE = new Date(
  2026,
  9,
  13
);


/*
 * Wie viele Wochen angezeigt werden.
 *
 * 10 = zehn Dienstage.
 */
const WEEKS_TO_SHOW = 10;


/*
 * Aufgaben.
 *
 * Reihenfolge ist gleichzeitig
 * die Reihenfolge der Rotation.
 */
const TASKS = [
  {
    id: "Küche",
    label: "Küche",
    icon: `
      <svg viewBox="0 0 24 24">
        <path d="M7 3v7"/>
        <path d="M4 3v4a3 3 0 0 0 6 0V3"/>
        <path d="M7 10v11"/>
        <path d="M17 3v18"/>
        <path d="M17 3c-2 2-3 4-3 6
                 0 2 1.5 3 3 3"/>
      </svg>
    `
  },

  {
    id: "Bäder",
    label: "Bäder",
    icon: `
      <svg viewBox="0 0 24 24">
        <path d="M5 10h14"/>
        <path d="M5 10v3
                 c0 3 2 5 7 5
                 s7-2 7-5v-3"/>
        <path d="M7 18v3"/>
        <path d="M17 18v3"/>
        <path d="M7 5a2 2 0 0 1 4 0v2"/>
        <path d="M11 5h2"/>
      </svg>
    `
  },

  {
    id: "Staubsaugen",
    label: "Staubsaugen",
    icon: `
      <svg viewBox="0 0 24 24">
        <path d="M8 3h6"/>
        <path d="M10 3v7"/>
        <path d="M10 10h4"/>
        <path d="M14 10
                 c3 0 5 2 5 5v4"/>
        <path d="M7 10
                 c-2 1-3 3-3 6v2"/>
        <path d="M4 18h6"/>
        <circle cx="17" cy="19" r="2"/>
      </svg>
    `
  }
];


/* ==================================================
   DATEN
================================================== */

let appData = {
  state: {},
  todos: []
};


/* ==================================================
   INITIALISIERUNG
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    PEOPLE.forEach(
      (name, index) => {
        document.getElementById(
          `person${index}`
        ).textContent = name;
      }
    );

    renderSchedule();
    renderTodos();

    loadData();

    document
      .getElementById("todoForm")
      .addEventListener(
        "submit",
        addTodo
      );
  }
);


/* ==================================================
   DATUM
================================================== */

function dateKey(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function formatDate(date) {

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      weekday: "short",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  ).format(date);
}


/* ==================================================
   ROTATION
================================================== */

/*
 * Jede Woche wandert die erste Aufgabe
 * einen Mitbewohner weiter.
 *
 * Beispiel:
 *
 * Woche 1
 * Anna   = Küche
 * Ben    = Bäder
 * Chris  = Staubsaugen
 *
 * Woche 2
 * Anna   = Staubsaugen
 * Ben    = Küche
 * Chris  = Bäder
 *
 * Woche 3
 * Anna   = Bäder
 * Ben    = Staubsaugen
 * Chris  = Küche
 */

function getTaskForPerson(
  weekIndex,
  personIndex
) {

  const taskIndex =
    (
      personIndex -
      weekIndex +
      TASKS.length * 100
    ) % TASKS.length;

  return TASKS[taskIndex];
}


/* ==================================================
   TABELLE ERZEUGEN
================================================== */

function renderSchedule() {

  const body =
    document.getElementById(
      "scheduleBody"
    );

  body.innerHTML = "";

  for (
    let week = 0;
    week < WEEKS_TO_SHOW;
    week++
  ) {

    const date =
      new Date(START_DATE);

    date.setDate(
      date.getDate() +
      week * 7
    );

    const dateString =
      dateKey(date);

    const row =
      document.createElement("tr");


    /* Datum */

    const dateCell =
      document.createElement("td");

    dateCell.className =
      "date-cell";

    dateCell.innerHTML = `
      ${formatDate(date)}
      <span class="date-week">
        Woche ${week + 1}
      </span>
    `;

    row.appendChild(dateCell);


    /* drei Personen */

    PEOPLE.forEach(
      (_, personIndex) => {

        const cell =
          document.createElement("td");

        cell.className =
          "chip-cell";

        const task =
          getTaskForPerson(
            week,
            personIndex
          );

        const key =
          `${dateString}|${task.id}|${PEOPLE[personIndex]}`;

        const chip =
          document.createElement("button");

        chip.type = "button";

        chip.className =
          "chip";

        if (appData.state[key]) {
          chip.classList.add("done");
        }

        chip.title =
          `${task.label} – ${PEOPLE[personIndex]}`;

        chip.innerHTML = `
          ${task.icon}
          <span class="checkmark">✓</span>
        `;

        chip.addEventListener(
          "click",
          () => {

            const newState =
              !Boolean(
                appData.state[key]
              );

            appData.state[key] =
              newState;

            chip.classList.toggle(
              "done",
              newState
            );

            /*
             * Konfetti nur beim
             * Erledigen.
             */
            if (newState) {
              confetti(chip);
            }

            saveChip(
              key,
              newState
            );
          }
        );

        cell.appendChild(chip);

        row.appendChild(cell);
      }
    );

    body.appendChild(row);
  }
}


/* ==================================================
   TODO LISTE
================================================== */

function renderTodos() {

  const list =
    document.getElementById(
      "todoList"
    );

  const count =
    document.getElementById(
      "todoCount"
    );

  list.innerHTML = "";

  count.textContent =
    `${appData.todos.length} ${
      appData.todos.length === 1
        ? "Todo"
        : "Todos"
    }`;


  if (!appData.todos.length) {

    list.innerHTML = `
      <div class="empty">
        Keine weiteren ToDos 🎉
      </div>
    `;

    return;
  }


  appData.todos.forEach(
    todo => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "todo-item";


      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      checkbox.className =
        "todo-checkbox";


      checkbox.addEventListener(
        "change",
        () => {

          if (
            !checkbox.checked
          ) {
            return;
          }

          confetti(
            checkbox
          );

          /*
           * Kleine Verzögerung,
           * damit man das Konfetti
           * noch sieht.
           */
          setTimeout(
            () => {

              appData.todos =
                appData.todos.filter(
                  item =>
                    item.id !== todo.id
                );

              renderTodos();

              deleteTodo(
                todo.id
              );

            },
            350
          );
        }
      );


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "todo-text";

      text.textContent =
        todo.text;


      item.appendChild(
        checkbox
      );

      item.appendChild(
        text
      );

      list.appendChild(
        item
      );
    }
  );
}


/* ==================================================
   TODO HINZUFÜGEN
================================================== */

function addTodo(event) {

  event.preventDefault();

  const input =
    document.getElementById(
      "todoInput"
    );

  const text =
    input.value.trim();

  if (!text) {
    input.focus();
    return;
  }


  const temporaryTodo = {

    id:
      "local-" +
      Date.now(),

    text: text,

    createdAt:
      new Date().toISOString()
  };


  /*
   * Sofort lokal anzeigen.
   */
  appData.todos.push(
    temporaryTodo
  );

  input.value = "";

  renderTodos();

  input.focus();


  /*
   * Danach zum Server senden.
   */
  addTodoToServer(text);
}


/* ==================================================
   GOOGLE APPS SCRIPT
================================================== */

function loadData() {

  if (
    !API_URL ||
    API_URL.includes(
      "https://script.google.com/macros/s/AKfycbwM_YEOQU_b4-2zYlC6Itvvaz2U-ftRaUnYFR96ZOeYFujB8NerJJ21x-EB1KKv829B/exec"
    )
  ) {

    setStatus(
      "Bitte Apps-Script-URL eintragen.",
      "error"
    );

    return;
  }


  setStatus(
    "Lade Daten …",
    ""
  );


  /*
   * JSONP:
   *
   * Dadurch funktioniert das Laden
   * trotz Cross-Origin zwischen
   * GitHub Pages und Apps Script.
   */

  const callbackName =
    "wgTodosCallback_" +
    Date.now();

  window[callbackName] =
    function(data) {

      appData =
        data || {
          state: {},
          todos: []
        };

      renderSchedule();
      renderTodos();

      setStatus(
        "Mit Google Sheets synchronisiert",
        "online"
      );

      delete window[
        callbackName
      ];

      script.remove();
    };


  const script =
    document.createElement(
      "script"
    );

  script.src =
    API_URL +
    "?callback=" +
    encodeURIComponent(
      callbackName
    );

  script.onerror =
    function() {

      setStatus(
        "Verbindung zu Google Sheets fehlgeschlagen.",
        "error"
      );

      delete window[
        callbackName
      ];

      script.remove();
    };

  document.body.appendChild(
    script
  );
}


/**
 * POST-Hilfsfunktion.
 *
 * Apps Script liefert bei Cross-Origin
 * keinen frei auslesbaren CORS-Response.
 *
 * Deshalb schicken wir die Änderung
 * per no-cors.
 */
function sendPost(params) {

  const body =
    new URLSearchParams(
      params
    );


  fetch(
    API_URL,
    {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: body.toString()
    }
  ).catch(
    error => {

      console.error(
        "Apps Script POST:",
        error
      );

      setStatus(
        "Speichern möglicherweise fehlgeschlagen.",
        "error"
      );
    }
  );
}


function saveChip(
  key,
  done
) {

  sendPost({

    action:
      "saveChip",

    key:
      key,

    done:
      String(done)
  });
}


function addTodoToServer(
  text
) {

  sendPost({

    action:
      "addTodo",

    text:
      text
  });
}


function deleteTodo(
  id
) {

  sendPost({

    action:
      "deleteTodo",

    id:
      id
  });
}


/* ==================================================
   STATUS
================================================== */

function setStatus(
  text,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  const statusText =
    document.getElementById(
      "statusText"
    );

  status.className =
    "status " +
    (type || "");

  statusText.textContent =
    text;
}


/* ==================================================
   KONFETTI
================================================== */

function confetti(
  element
) {

  const rect =
    element.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;


  const pieces = 28;


  for (
    let i = 0;
    i < pieces;
    i++
  ) {

    const piece =
      document.createElement(
        "div"
      );

    piece.className =
      "confetti";


    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      60 +
      Math.random() * 150;


    const x =
      Math.cos(angle) *
      distance;

    const y =
      Math.sin(angle) *
      distance;


    piece.style.left =
      centerX + "px";

    piece.style.top =
      centerY + "px";


    piece.style.background =
      [
        "#ff4d6d",
        "#4dabf7",
        "#ffd43b",
        "#69db7c",
        "#845ef7",
        "#ff922b"
      ][
        Math.floor(
          Math.random() * 6
        )
      ];


    piece.style.setProperty(
      "--x",
      x + "px"
    );

    piece.style.setProperty(
      "--y",
      y + "px"
    );

    piece.style.setProperty(
      "--rotation",
      (
        Math.random() *
        720 -
        360
      ) + "deg"
    );


    document.body.appendChild(
      piece
    );


    setTimeout(
      () => {
        piece.remove();
      },
      1000
    );
  }
}

</script>

</body>
</html>
